name: save_the_fuel
description: "Fuel saving app with Cebu traffic zones using open maps."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.3
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.1
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  sensors_plus: ^6.1.2
  flutter_tts: ^4.2.3
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
